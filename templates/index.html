            { id: 50, title: "Mental Health: Workplace stress declared national emergency", source: "The Huffington Post", lang: "EN", bias: "Gauche", category: "Société", score: 87, url: "https://www.huffpost.com", summary: "Following a comprehensive psychological study tracking office environments, a coalition of union representatives and medical experts has declared endemic workplace burnout a major public health crisis. They are drafting urgent legislation to enforce a strict 'right to disconnect', penalizing companies that monitor employee digital communication outside official hours." }

        let currentLangFilter = 'ALL';

        // Initialisation au chargement
        window.onload = () => {
            filterArticles();
        };

        // Gestionnaire de filtre linguistique (Boutons)
        function setLang(lang) {
            currentLangFilter = lang;
            
            // Mise à jour visuelle des boutons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-gray-800', 'shadow-sm');
                btn.classList.add('text-gray-600', 'hover:text-gray-900');
            });

            const activeBtn = document.getElementById(`lang-${lang}`);
            activeBtn.classList.remove('text-gray-600', 'hover:text-gray-900');
            activeBtn.classList.add('bg-white', 'text-gray-800', 'shadow-sm');

            filterArticles();
        }

        // Logique principale de filtrage et d'affichage
        function filterArticles() {
            const biasFilterValue = document.getElementById('bias-filter').value;
            const grid = document.getElementById('articles-grid');
            
            // Filtrage des données
            const filtered = articlesDataset.filter(article => {
                const matchLang = (currentLangFilter === 'ALL' || article.lang === currentLangFilter);
                const matchBias = (biasFilterValue === 'ALL' || article.bias === biasFilterValue);
                return matchLang && matchBias;
            });

            // Mise à jour des compteurs
            document.getElementById('visible-count').innerText = filtered.length;

            // Rendu HTML des cartes articles
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500 bg-white rounded-xl border border-dashed border-gray-300">
                        Aucun article ne correspond à ces critères de filtrage.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(article => {
                // Définition des couleurs de badge selon le biais politique
                let biasBadgeColor = "";
                if (article.bias === 'Gauche') biasBadgeColor = "bg-red-50 text-red-700 border-red-200";
                else if (article.bias === 'Centre') biasBadgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                else if (article.bias === 'Droite') biasBadgeColor = "bg-blue-50 text-blue-700 border-blue-200";

                return `
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all duration-200 p-5 flex flex-col group">
                        <div class="flex-grow">
                            <!-- Métadonnées de l'article -->
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${biasBadgeColor} border">
                                    Tendance : ${article.bias}
                                </span>
                                <div class="flex items-center gap-1.5 text-xs text-gray-400">
                                    <span class="font-medium text-gray-600">${article.source}</span>
                                    <span>•</span>
                                    <span class="uppercase tracking-wider font-bold text-indigo-600">${article.lang}</span>
                                </div>
                            </div>

                            <!-- Titre -->
                            <h3 class="text-base font-bold text-gray-900 group-hover:text-indigo-900 transition-colors mb-3">
                                ${article.title}
                            </h3>

                            <!-- Titre Résumé IA -->
                            <div class="text-xs font-semibold text-indigo-950 uppercase tracking-wider mb-1 flex items-center gap-1">
                                <span>⚡ Décryptage Synthétique IA :</span>
                            </div>

                            <!-- Résumé Long -->
                            <p class="text-sm text-gray-600 leading-relaxed mb-5">
                                ${article.summary}
                            </p>
                        </div>

                        <!-- Footer de la carte -->
                        <div class="pt-4 border-t border-gray-100 flex flex-col gap-3 mt-auto">
                            <div class="flex items-center justify-between">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800">
                                    ${article.category}
                                </span>
                                <div class="text-right">
                                    <span class="text-xs text-gray-400">Fiabilité IA :</span>
                                    <span class="text-sm font-bold text-emerald-600">${article.score}%</span>
                                </div>
                            </div>

                            <!-- Bouton Lien vers l'article d'origine -->
                            <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="w-full text-center inline-flex items-center justify-center gap-1 bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-200 text-xs font-semibold text-gray-700 hover:text-indigo-700 py-2 px-4 rounded-lg transition-all">
                                Lire l'article original sur ${article.source}
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
